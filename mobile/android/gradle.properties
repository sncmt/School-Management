# Sized for a PC with about 6 GB of RAM: the template's -Xmx8G is more than the whole
# machine has and pushes Windows into heavy paging during builds.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# the Kotlin compiler runs in its own process: cap it too
kotlin.daemon.jvmargs=-Xmx1G
# Kotlin's incremental caches break when the plugins' sources (pub cache on C:) and this
# project (D:) are on different drives: "Storage ... is already registered"
kotlin.incremental=false
# fewer tasks at once: slower, but much less memory at the peak
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
