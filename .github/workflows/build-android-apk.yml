name: Build Android APK

# Run manually: GitHub repo -> Actions tab -> "Build Android APK" -> Run workflow.
# The finished APK shows up at the bottom of the run page under "Artifacts".
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile   # folder that holds pubspec.yaml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Optional: sign with YOUR OWN key (recommended for website downloads, see guide).
      # If the 4 secrets below are not set, the APK is signed with the debug key and still installs fine.
      - name: Set up release signing (only if secrets exist)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/upload.jks"
            {
              echo "storeFile=$GITHUB_WORKSPACE/upload.jks"
              echo "storePassword=$KS_PASS"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASS"
            } > android/key.properties
            echo "Signing with custom key"
          else
            echo "No keystore secrets: using debug signing"
          fi

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: sncmt-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
