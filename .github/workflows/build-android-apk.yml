name: Build Android APK

# Run it: GitHub repo -> Actions tab -> "Build Android APK" -> Run workflow.
#
# It checks the code, runs the tests, builds the app signed with YOUR key, and publishes it as
# a release of the public repo sncmt/sncmt-app, which holds only the app files (this code repo
# can stay private). The newest one is always at:
#   https://github.com/sncmt/sncmt-app/releases/latest/download/sncmt.apk
# and the website's sncmt.com/app/download leads there; the app's "Update available" prompt
# reads the same releases.
#
# Secrets: the 4 ANDROID_* signing secrets, and RELEASES_TOKEN (a fine-grained token of the
# sncmt account: only the sncmt-app repo, Contents: Read and write).
#
# Versions: the name (1.0.0) comes from mobile/pubspec.yaml; the build number is this
# workflow's run number, so it always goes up and phones accept every new APK as an update.
on:
  workflow_dispatch:

env:
  RELEASE_REPO: sncmt/sncmt-app

permissions:
  contents: read # the release goes to the other repo, with RELEASES_TOKEN

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      # before ten minutes of building: can the release be published at all?
      - name: Check the release token
        working-directory: .
        env:
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add the RELEASES_TOKEN secret (Settings > Secrets and variables > Actions): a fine-grained token for $RELEASE_REPO with Contents: Read and write."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/$RELEASE_REPO")
          if [ "$code" != "200" ]; then
            echo "::error::RELEASES_TOKEN can't reach $RELEASE_REPO (HTTP $code): it may have expired, or not include that repo. Make a new one and update the secret."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Check the code
        run: flutter analyze

      - name: Run the tests
        run: flutter test

      # Never publish a debug-signed APK: GitHub makes a new debug key on every run, and an
      # APK signed with another key can't update the one already installed.
      - name: Set up release signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Add the 4 signing secrets first (Settings > Secrets and variables > Actions): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD"
            exit 1
          fi
          # copying from PowerShell can add spaces or line breaks: base64 refuses them
          if ! printf '%s' "$KS_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/upload.jks" 2>/dev/null || [ ! -s "$RUNNER_TEMP/upload.jks" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not the key file as text. Copy it again (mobile/store/README.md, step 1) and update the secret."
            exit 1
          fi
          # a wrong password or alias would only fail much later, in the build: check now
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KS_PASS" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The key file is fine, but ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_ALIAS (should be: upload) does not match it."
            exit 1
          fi
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > android/key.properties

      - name: Read the version
        id: version
        run: |
          name=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Building version $name (build ${{ github.run_number }})"

      - name: Build the APK
        run: |
          # real phones only: 64-bit and older 32-bit ARM (x86_64 is for PC emulators; leaving it
          # out saves parents several MB of mobile data)
          flutter build apk --release --target-platform android-arm,android-arm64 --build-number=${{ steps.version.outputs.build }}
          cp build/app/outputs/flutter-apk/app-release.apk build/sncmt.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sncmt-apk
          path: mobile/build/sncmt.apk

      # the app reads the build number back from this tag ("app-v1.0.0-b42") to offer updates
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASE_REPO }}
          token: ${{ secrets.RELEASES_TOKEN }}
          # the tag goes on that repo's own branch (it holds only a README)
          target_commitish: main
          tag_name: app-v${{ steps.version.outputs.name }}-b${{ steps.version.outputs.build }}
          name: SNCMT app ${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.build }})
          body: |
            Android app, version ${{ steps.version.outputs.name }}, build ${{ steps.version.outputs.build }}.
            Download: https://sncmt.com/app
          files: mobile/build/sncmt.apk
          make_latest: true
