# The whole app: docker compose up -d --build
#   web    Next.js (the only service with a public port)
#   api    Express, reachable from web as http://api:5000
#   redis  rate limiting (memory only; nothing to keep)
#   migrate  one-off: docker compose run --rm migrate
#
# Settings that differ between machines are in ./.env (see .env.example);
# the API's own settings and secrets are in ./server/.env.

name: school-management

services:
  web:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_ROOT_DOMAIN: ${PUBLIC_HOST:-localhost:3000}
        NEXT_PUBLIC_SITE_PROTOCOL: ${SITE_PROTOCOL:-http}
        API_URL: http://api:5000
    environment:
      # read at runtime by server components (lib/site.ts)
      API_URL: http://api:5000
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./server
      target: runtime
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      REDIS_URL: redis://redis:6379
      ROOT_DOMAIN: ${ROOT_DOMAIN:-sncmt.com}
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    # only rate-limit counters live here: no saving to disk, bounded memory
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped

  migrate:
    build:
      context: ./server
      target: migrate
    env_file: ./server/.env
    profiles: ["tools"]
